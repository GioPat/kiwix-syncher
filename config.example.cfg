global: <
  cooldown_minutes: 10;
  watching_directory: "./zims";
  base_url: "https://download.kiwix.org/";
  verbose: true;
  # Optional. Runs after any cycle that added or replaced a ZIM (never on an
  # idle cycle). Use it to rebuild a kiwix-serve library so the server picks up
  # rotated files without a restart, paired with `kiwix-serve -M`.
  #
  # It runs through `sh -c` from the syncher's working directory, so the same
  # relative path used by watching_directory works here.
  #
  # Building the library *inside* the ZIM directory keeps it position
  # independent: libkiwix resolves relative book paths against the directory
  # holding library.xml, so with bare file names the volume can be mounted
  # anywhere - a different path in a cluster included - and still resolve.
  #
  # Rebuild from empty rather than appending: `kiwix-manage add` on an existing
  # library would keep the entries of the ZIMs this cycle just deleted.
  #
  # Give each instance its OWN library file if you run several synchers - they
  # would otherwise race on one file. kiwix-serve takes a semicolon separated
  # list: kiwix-serve --library "history/library.xml;maps/library.xml" -M
  on_sync_complete: "cd ./zims && rm -f library.xml && kiwix-manage library.xml add *.zim";
>;
watching_zims: [
  # The path is relative to base_url and must match the mirror layout exactly:
  # everything up to the last "/" is requested as a directory listing, and the
  # rest is the pattern matched against the file names found there.
  "zim/devdocs/devdocs_en_[angular | angularjs | ansible | apache-http-server | astro | axios | bash | browser-support-tables | c | chai | chef | clojure | cmake| composer | cpp |css | cypress | d3 | d| dart | deno |django | docker | duckdb | electron | erlang | eslint | fastapi | fish | flask | gcc | gnu-make | go | godot | groovy | grunt | haproxy | haskell | html | htmx | http | javascript | jest | jinja | julia | kotlin | kubectl | kubernetes |  lua | marionette | markdown | mocha | moment | mongoose | nextjs | nginx-lua-module | nginx | nim | nix | node | ocaml | opengl | php | postgresql | prettier | pygame | pytorch | qt | python | react | react-router | react-native | rust | tailwindcss | tensorflow | terraform | sass | scikit-image | scikit-learn | svg | vue | zig ]_[date].zim",
  "zim/freecodecamp/freecodecamp_en_all_[date].zim",
  # Gutenberg file names are gutenberg_en_all_<date>.zim, so the "all" has to be
  # in the pattern - "gutenberg_[en | it]_[date].zim" matches nothing.
  "zim/gutenberg/gutenberg_[en | it]_all_[date].zim",
];