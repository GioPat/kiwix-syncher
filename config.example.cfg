global: <
  cooldown_minutes: 10;
  watching_directory: "./zims";
  base_url: "https://download.kiwix.org/";
  verbose: true;
  # Optional. Runs after any cycle that added or replaced a ZIM (never on an
  # idle cycle). Use it to rebuild a kiwix-serve library so the server picks up
  # rotated files without a restart, paired with `kiwix-serve -M`.
  #
  # Rebuild from empty rather than appending: `kiwix-manage add` on an existing
  # library would keep the entries of the ZIMs this cycle just deleted.
  #
  # Give each instance its OWN library file if you run several synchers - they
  # would otherwise race on one file. kiwix-serve takes a semicolon separated
  # list: kiwix-serve --library "a.xml;b.xml" -M
  on_sync_complete: "rm -f /library/zims.xml && kiwix-manage /library/zims.xml add /zims/*.zim";
>;
watching_zims: [
  "zim/devdocs/zim/devdocs/devdocs_en_[angular | angularjs | ansible | apache-http-server | astro | axios | bash | browser-support-tables | c | chai | chef | clojure | cmake| composer | cpp |css | cypress | d3 | d| dart | deno |django | docker | duckdb | electron | erlang | eslint | fastapi | fish | flask | gcc | gnu-make | go | godot | groovy | grunt | haproxy | haskell | html | htmx | http | javascript | jest | jinja | julia | kotlin | kubectl | kubernetes |  lua | marionette | markdown | mocha | moment | mongoose | nextjs | nginx-lua-module | nginx | nim | nix | node | ocaml | opengl | php | postgresql | prettier | pygame | pytorch | qt | python | react | react-router | react-native | rust | tailwindcss | tensorflow | terraform | sass | scikit-image | scikit-learn | svg | vue | zig ]_[date].zim",
  "zim/freecodecamp/freecodecamp_en_all_[date].zim",
  "zim/gutenberg/gutenberg_[en | it]_[date].zim",
];